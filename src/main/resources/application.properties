spring.config.import=optional:file:./application-local.properties
spring.application.name=tradeFox
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fox}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# Override this with a long random value outside local development.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# INDstocks API credentials are provided only through environment variables.
indstocks.api-base-url=https://api.indstocks.com
indstocks.client-id=${INDSTOCKS_CLIENT_ID:}
indstocks.mpin=${INDSTOCKS_MPIN:}
indstocks.totp-secret=${INDSTOCKS_TOTP_SECRET:}
indstocks.scrip-codes=${INDSTOCKS_SCRIP_CODES:}
indstocks.websocket-instruments=${INDSTOCKS_WEBSOCKET_INSTRUMENTS:}
# 2026 NSE equity holidays; override with the current exchange calendar each year.
indstocks.market-holidays=${INDSTOCKS_MARKET_HOLIDAYS:2026-01-15,2026-01-26,2026-03-03,2026-03-26,2026-03-31,2026-04-03,2026-04-14,2026-05-01,2026-05-28,2026-06-26,2026-09-14,2026-10-02,2026-10-20,2026-11-10,2026-11-24,2026-12-25}
indstocks.token-check-ms=60000
indstocks.market-refresh-ms=60000
